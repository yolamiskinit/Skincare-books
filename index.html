<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9678f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Books">
<title>My Skincare Books</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="auth-screen" style="display:none">
  <div class="topbar">
    <div>
      <h1>My Skincare Books</h1>
      <div class="sub">Sign in to sync your data</div>
    </div>
  </div>
  <main style="padding:16px">
    <div class="card">
      <h3 id="auth-title" style="margin-top:0;text-transform:none;font-size:17px;color:var(--text)">Sign In</h3>
      <label>Email</label><input type="email" id="auth-email" autocomplete="username">
      <label>Password</label><input type="password" id="auth-password" autocomplete="current-password">
      <div id="auth-error" style="color:var(--red);font-size:12.5px;margin-top:8px"></div>
      <button class="btn primary" id="auth-submit-btn">Sign In</button>
      <button class="link-btn" id="auth-toggle-btn" style="width:100%;text-align:center;margin-top:8px">Don't have an account? Sign up</button>
    </div>
  </main>
</div>

<div id="app" style="display:none">
  <div class="topbar">
    <div>
      <h1 id="business-name">My Skincare Books</h1>
      <div class="sub" id="header-sub">Sales &amp; Bookkeeping</div>
    </div>
    <button class="icon-btn" id="settings-btn">&#9881;</button>
  </div>

  <main id="main-content"></main>

  <button class="fab" id="fab-btn" style="display:none">+</button>

  <nav class="bottomnav">
    <button data-tab="home" class="active"><span class="ic">&#127968;</span>Home</button>
    <button data-tab="sales"><span class="ic">&#128176;</span>Sales</button>
    <button data-tab="customers"><span class="ic">&#128100;</span>Customers</button>
    <button data-tab="inventory"><span class="ic">&#128230;</span>Stock</button>
    <button data-tab="expenses"><span class="ic">&#128179;</span>Expenses</button>
    <button data-tab="reports"><span class="ic">&#128202;</span>Reports</button>
  </nav>

  <div id="modal-root"></div>
  <div class="toast" id="toast"></div>
</div>

<script type="module" src="firebase-init.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
